[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fastapi-jobs"
version = "0.1.0"
description = "A lightweight, FastAPI-native background job system between BackgroundTasks and Celery."
readme = "README.md"
license = "MIT"
authors = [{ name = "stackadnan" }]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.100",
    "aiosqlite>=0.19",
]

[project.optional-dependencies]
redis = ["redis>=5.0"]
dashboard = ["jinja2>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/stackadnan/fastapi-jobs"
Issues = "https://github.com/stackadnan/fastapi-jobs/issues"

[tool.hatch.build.targets.wheel]
packages = ["fastapi_jobs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
