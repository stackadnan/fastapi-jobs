name: Bug report
description: Something isn't working as documented
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: >
        A small, self-contained code sample that reproduces the issue. Include how
        Jobs/Worker are configured (database URL, max_concurrency, retention, etc.)
        if relevant.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: fastapi-jobs version
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.12.4"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - SQLite
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or traceback
      render: shell
